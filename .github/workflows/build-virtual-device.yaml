name: Build Virtual Device App for Android

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build-virtual-device.yaml'

jobs:
  build-android-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: ghcr.io/project-chip/chip-build-android:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Build virtual-device-app (arm64)
        env:
          ANDROID_HOME: /opt/android/sdk
          ANDROID_NDK_HOME: /opt/android/sdk/ndk/28.2.13676358
        run: |
          yes | /opt/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          source scripts/bootstrap.sh
          ./scripts/build/build_examples.py --target android-arm64-virtual-device-app build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virtual-device-app-arm64-apk
          path: out/android-arm64-virtual-device-app/VirtualDeviceApp/app/outputs/apk/debug/app-debug.apk

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: virtual-device-app-arm64-libs
          path: |
            out/android-arm64-virtual-device-app/lib/jni/arm64-v8a/*.so
            out/android-arm64-virtual-device-app/lib/*.jar
          if-no-files-found: warn
