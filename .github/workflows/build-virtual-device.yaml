name: Build Virtual Device App for Android

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build-virtual-device.yaml'

jobs:
  build-android-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d $ANDROID_HOME/cmdline-tools/
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/10.0
          yes | $ANDROID_HOME/cmdline-tools/10.0/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358" > /dev/null 2>&1 || true
          yes | $ANDROID_HOME/cmdline-tools/10.0/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Set up Kotlin
        run: |
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.1.10/kotlin-compiler-2.1.10.zip -o /tmp/kotlin.zip
          sudo unzip -q /tmp/kotlin.zip -d /usr/local/lib/
          echo "/usr/local/lib/kotlinc/bin" >> $GITHUB_PATH

      - name: Bootstrap
        run: |
          source scripts/bootstrap.sh

      - name: Build virtual-device-app (arm64)
        run: |
          ./scripts/build/build_examples.py --target android-arm64-virtual-device-app build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virtual-device-app-arm64-apk
          path: out/android-arm64-virtual-device-app/VirtualDeviceApp/app/outputs/apk/debug/app-debug.apk

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: virtual-device-app-arm64-libs
          path: |
            out/android-arm64-virtual-device-app/lib/jni/arm64-v8a/*.so
            out/android-arm64-virtual-device-app/lib/*.jar
          if-no-files-found: warn
